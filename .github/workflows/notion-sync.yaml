name: Notion — Sync Stock Data

on:
  schedule:
    # - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TICKERS_DB_ID: ${{ secrets.TICKERS_DB_ID }}
          PRICES_DB_ID: ${{ secrets.PRICES_DB_ID }}
        run: uv run --directory notion sync.py