name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Import smoke test
        run: |
          uv sync --frozen
          uv run python -c "
          import capital.dashboard.app, dash
          paths = {p['path'] for p in dash.page_registry.values()}
          assert len(dash.page_registry) == 10, sorted(paths)
          assert '/factor-screen' in paths, sorted(paths)
          "
          uv run python -c "
          from capital.analytics.factors.model import run_factor_model
          from capital.analytics.factors.spec import ModelSpec
          from capital.jobs import queue, handlers
          from capital.data import factor_store
          assert 'factor_model' in handlers.HANDLERS
          "

  # config/security_master.csv is a git-tracked artifact deployed via the SSH
  # git-pull below — it is NOT synced to S3. The dashboard and the ingest both
  # read it from the local checkout (see get_security_master / load_universe).
  deploy:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /opt/capital-dashboard
            git pull
            if git diff HEAD@{1} --name-only | grep -qE "pyproject.toml|uv.lock"; then
              ~/.local/bin/uv sync --frozen --extra ingest
            fi
            sudo systemctl restart capital-dashboard
