[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capital-team"
version = "0.1.0"
description = "AIC portfolio analytics: data pipeline, analytics library, and dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash[diskcache]>=2.17.0",
    "dash-mantine-components>=0.14.0",
    "diskcache>=5.6.0",
    "gunicorn>=22.0.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "plotly>=5.20.0",
    "pyarrow>=14.0.0",
    "boto3>=1.34.0",
    "numpy>=1.26.0",
    "yfinance>=1.4.1",
    "python-dotenv>=1.2.2",
    "botocore[crt]>=1.43.18",
    "matplotlib>=3.10.9",
    "cachelib>=0.13",
    "cvxpy>=1.4.0",
    "arch>=6.3.0",
    "statsmodels>=0.14.0",
    # Imported directly by the factor model (null-space reparameterisation of the
    # constrained cross-sectional regression) — not just via statsmodels.
    "scipy>=1.11.0",
    "pykalman>=0.9.7",
    "filterpy>=1.4.5",
]

[project.scripts]
capital-ingest = "capital.ingest.cli:main"

[project.optional-dependencies]
# LSEG SDK is only needed by the ingestion job — keep it out of dashboard installs.
ingest = [
    "lseg-data>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capital"]
