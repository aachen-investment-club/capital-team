# Rate-limit the Dash callback endpoint so heavy background callbacks
# (optimiser, GARCH fits) can't be hammered by bots on the public site.
limit_req_zone $binary_remote_addr zone=dash_callbacks:10m rate=10r/s;

server {
    listen 80;
    server_name portfolio.aachen-investment-club.de;

    gzip on;
    gzip_types application/json text/css application/javascript;

    # Dash is plain HTTP (no websockets) — no Upgrade headers needed.
    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180;
    }

    location /_dash-update-component {
        limit_req zone=dash_callbacks burst=20 nodelay;
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        expires 7d;
    }
}
